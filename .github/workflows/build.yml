name: Build PS2 ELF

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install make
        run: apk add --no-cache make

      - name: Build
        run: make clean && make

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: lavalamp-ps2-elf
          path: lavalamp.elf
